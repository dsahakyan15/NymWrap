[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
exceptions = [
  { name = "libfuzzer-sys", version = "=0.4.13", allow = ["NCSA"] },
  { name = "doctest-file", version = "=1.1.1", allow = ["0BSD"] },
  { name = "recvmsg", version = "=1.0.0", allow = ["0BSD"] },
  { name = "sqlcipher-src", version = "=420.0.0", allow = ["blessing", "WTFPL"] },
  { name = "async_executors", version = "=0.7.0", allow = ["Unlicense"] },
  { name = "coarsetime", version = "=0.1.38", allow = ["BSD-2-Clause"] },
  { name = "webpki-roots", version = "=1.0.12", allow = ["CDLA-Permissive-2.0"] },
  { name = "zstd-sys", version = "=2.1.3", allow = ["BSD-3-Clause", "BSD-2-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
