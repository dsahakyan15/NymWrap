
# cargo-vet audits file

[[audits.cfg-if]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
version = "1.0.5"
notes = """
AI full source review, not an independent human audit.
Published archive SHA-256: 4e7648175b45a9a48536d676f68d918270699102aa8dab5496df06904c914600.
Read offline from the existing Cargo cache and verified against the cached registry index. Reviewed the full lib.rs (including tests), both Cargo manifests, package file inventory and cross-crate test. The no_std macro selects the first matching cfg branch, excludes previously matched predicates, and wraps each branch in a helper invocation so cfg covers all its items. Recursion consumes one branch at each step; hygienic $crate paths avoid caller-name capture. No unsafe, build script, procedural macro, native code, I/O or ambient authority. The optional rustc-dep-of-std dependency remains subject to its separate audit.
Ordinary cargo test --offline did not resolve the uncached optional dependency and ran no tests. Direct default-feature tests with the pinned rustc/rustdoc passed: two unit tests, one cross-crate test and one doctest. This does not certify optional dependencies or platform CI.
"""

[[audits.crypto-common]]
who = "NymWrap Codex agent (проверено агентом, не человеком)"
criteria = "safe-to-deploy"
version = "0.2.2"
notes = """
Проверено агентом, не человеком. AI source review by Codex; not an independent human security audit.
Published archive SHA-256: ce6e4c961d6cd6c9a86db418387425e8bdeaf05b3c8bc1411e6dca4c252f1453.
Archive freshly checked against Cargo.lock and the local sparse registry index; reviewed directly from safely extracted archive bytes.
Reviewed both manifests, README, and all code in lib.rs, generate.rs and hazmat.rs, including each serialization macro expansion family. no_std and forbid(unsafe_code); no build script, native code, process, file or network access. Key/IV slice constructors perform fallible exact-size array conversions before invoking algorithm constructors; invalid lengths return errors rather than truncating/padding secret material. Trait blanket implementations preserve those checks. Serialization uses fixed-width little-endian conversions; chunks_exact uses fixed nonzero integer widths, so each try_into().unwrap() receives exactly the required length for all input byte values.
Random generation requires CryptoRng/TryCryptoRng and propagates fill failures without returning partially filled keys; explicit infallible system generation may panic on entropy failure. Underlying RNG, hybrid-array and typenum soundness require separate audits; this is not certification of cryptographic algorithms or their implementations. SetIvState::peek restores IV only on normal closure return, not during unwinding; callers must not treat it as transactional or use it to guarantee nonce uniqueness. No zeroization guarantee for local temporaries is inferred. Offline all-feature compilation in an isolated source copy seeded with netd's lock resolution succeeded; upstream has zero unit tests and four ignored doctests, so this is compile evidence only.
"""

[[audits.displaydoc]]
who = "NymWrap Codex agent (проверено агентом, не человеком)"
criteria = "safe-to-deploy"
version = "0.2.7"
notes = """
Проверено агентом, не человеком. AI source review by Codex; not an independent human security audit.
Published archive SHA-256: c6232dd377dcc64799954cbd3a9bb882e9cdc1308ccd87b1c098f1fb2eaf82a8.
Archive verified against Cargo.lock and the local sparse registry index; reviewed directly from archive bytes.
Reviewed both manifests and all production modules: lib.rs, attr.rs, expand.rs and fmt.rs, including both std/no_std expansion branches, shorthand parsing and generic bounds. No build script, unsafe, native component or ambient I/O. Doc text is retained as syn::LitStr; identifiers use checked character classes and compiler token types, never eval, a shell or a parsed arbitrary expression. Brace slicing uses ASCII byte positions from find; identifier slicing uses char_indices. Malformed or unsupported attributes may panic during compilation or produce diagnostics, not runtime execution of doc text. Generated code destructures a shared borrow, adds core::fmt::Display bounds, emits ordinary write! calls and safe borrowed Path display helpers; it introduces no unsafe impl or unchecked lifetime extension. Empty-enum unreachable! is not reachable by a safely constructed value. Formatting intentionally exposes values selected by the caller: NymWrap must retain its content-free logging policy. Dependencies syn/quote/proc-macro2 remain separately accountable. The full upstream offline test command was blocked by an uncached pretty_assertions dev dependency and ran no tests. A separate dependency-only harness used three unmodified upstream integration test files: std mode passed three tests, no-default-features passed two, and the no_std target compiled in both. Other upstream unit/UI/doctests were not run.
"""

