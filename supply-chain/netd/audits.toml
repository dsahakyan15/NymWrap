trusted-publisher = "github:google/zerocopy"
start = "2026-11-21"
end = "2026-11-22"
notes = """ADR 0103 continuation: Trust the Zerocopy maintainers in the verified google/zerocopy repository for zerocopy and its matching derive. The packaged Fuchsia-authored crate-level documentation defines checked byte conversion, layout, alignment and immutability contracts and links this repository. Product trust covers unsafe byte/layout validity, pointer provenance and emitted derive implementations on hostile bytes; the Google namespace or a successful release run alone is not a code audit. Both package VCS commits match the recorded publication run. Package: zerocopy 0.8.64 (Zerocopy makes zero-cost memory manipulation effortless. We write "unsafe" so you don't have to.). Exact uploader, archive/index/registry checksum, locked-version checks and identity evidence: review-2026-11-26-continuation.json. Historical one-day UTC window only. This is publisher trust, not a source audit by an agent or a human. Local path-fork modifications and callers remain separately reviewable."""

