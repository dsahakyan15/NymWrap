[[audits.lazy_static]]
who = "Codex: проверено агентом, не человеком"
criteria = "safe-to-deploy"
version = "1.5.1"
notes = "проверено агентом, не человеком. SHA-256 .crate: 20870f649af7073d53e38067b2a84312175d56ea15217e1b15bc83506ec50afb. Read both manifests and every Rust source, example and test. Examined unsafe std Lazy<T>: Once::call_once completes initialization in Cell<MaybeUninit<T>> before any reference is returned, publishes it to concurrent readers, and poison prevents reading after an initializer panic. Static borrow and T:Sync prevent premature destruction or cross-thread shared access to non-Sync data; values are never dropped by design. The optional no_std wrapper delegates synchronization to spin::Once and needs independent spin coverage. Macros use hygienic crate paths and compiler-checked caller expressions, retain visibility/Sync constraints and require explicit unsafe at unsafe caller expressions. No build script, FFI or direct OS access. Recursive/cyclic initializers may deadlock; static secrets are not zeroized on exit, so applications must not use this facility to store secret material needing Drop. Exact reviewed files and hashes: review-2026-11-26-third.json. Dependencies require separate coverage."

