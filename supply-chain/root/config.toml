version = "1.7.0"
criteria = "safe-to-deploy"
notes = "Проверено агентом, не человеком. No source audit granted. Root-only individually verified non-reachability exception. Only the unselected zbus async-io/async-process backend (and dependency dev metadata) requests blocking; root selects synchronous keyring Secret Service. Exact archive SHA-256 a70e4329df6cb94385eed412ec92375c3cdd8a6e502493d1229b6414e4036dfa. Read: workspace Cargo.toml, nw-cred/nw-vault manifests and relevant upstream dependency/feature sections; full empty inverse-tree outputs retained in review-2026-11-26-batch-5.json. Exact command: cargo tree --locked --offline --target all -e normal,build,dev -i blocking@1.7.0; repeated as cargo tree --locked --offline --target all -e normal,build,dev -i blocking@1.7.0 --all-features. Both exit 0 with empty stdout; no active normal/build/dev path for any target. Enabling keyring async-secret-service, crypto-openssl or zbus backends, adding a direct path, changing dependency features or replacing the lockfile invalidates this exception and requires renewed review. This does not certify dormant code or other graphs. ADR 0102 batch 5."

