[[exemptions.recvmsg]]
version = "1.0.0"
criteria = "safe-to-deploy"
notes = "ADR 0111: принятый риск по решению владельца 2026-11-28, НЕ аудит. Прежняя запись ниже сохранена; её фраза о том, что wrapper отвергает exemptions, устарела. Проверено агентом, не человеком. Deployment-specific exception for recvmsg 1.0.0, NOT a safe-to-deploy source audit. Archive SHA-256 d3edd4d5d42c92f0a659926464d4cce56b562761267ecf0f469d85b7de384175. The desktop-5 synthetic ledger-owner probe was rerun: MsgBuf::try_extend_lifetime drops the original owned buffer before returning its copied owner (one premature and two total nonempty releases); make_owned delegates to it. This known UAF/double-free risk is not accepted for executable paths. Current root and desktop reach the crate only through interprocess 2.4.9 -> nw-ipc. NymWrap imports only local_socket::tokio::Stream/Listener and security/credential helpers. nw-ipc read_frame_timeout allocates Zeroizing<Vec<u8>> and passes a borrowed slice to AsyncReadExt::read_exact. Local socket dispatch on Windows uses DuplexPipeStream<Bytes>, whose AsyncRead forwards to RawPipeStream::poll_read_readbuf -> Tokio try_read_buf(ReadBuf); on Unix it uses Tokio UnixStream::try_read_buf. No MsgBuf, OwnedBuf, RecvMsg/AsyncRecvMsg, make_owned or try_extend_lifetime occurs on these paths. Windows message-mode RecvMsg is a separate impl for PipeStream<Messages, Sm>; the dependency is still compiled, not wholly unreachable. Invalidate before any new interprocess/recvmsg caller or dependency edge, message/datagram API or buffer-owner conversion, changes to nw-ipc framing/local stream exports, relevant features/platforms, or either dependency version. Repeat source-path review and the ledger probe before renewing. Exact path/source hashes and limitations: docs/adr/0110-cargo-vet-findings-and-ipc-reachability.md and supply-chain/root/review-2026-11-26-dep-fixes.json. Wrapper still rejects all exemptions; release gate remains failed."

