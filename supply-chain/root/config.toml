[[exemptions.async-broadcast]]
version = "0.7.2"
criteria = "safe-to-deploy"
notes = "ADR 0111: принятый риск по решению владельца 2026-11-28, НЕ аудит. Прежняя запись ниже сохранена; её фраза о том, что wrapper отвергает exemptions, устарела. Проверено агентом, не человеком. set_capacity(0) with overflow=true allows the queue to exceed capacity. Reproduced in the synthetic review harness. No safe-to-deploy audit granted. Exact archive SHA-256 435a87a52755b8f27fcf321ac4f04b2802e337c8c4872923137471ec39c37532. Root-only non-reachability exception: these packages are reachable in Cargo metadata through keyring 3.6.3 -> optional secret-service 4.0.0 -> zbus 4.4.0, but root selects sync-secret-service -> dbus-secret-service, never async-secret-service. cargo tree --locked --offline --target all -e normal,build,dev -i async-broadcast, with and without --all-features, has no active path. Therefore no current NymWrap process executes this code. Enabling the asynchronous backend, adding a direct dependency or changing keyring features invalidates this exception and requires renewed review. No fixed published release was confirmed: latest checked code retains the problematic operation. Analysis and exact sources: docs/adr/0102-root-dependency-audit-sources.md#root-4-unreachable; evidence in supply-chain/root/review-2026-11-26-batch-4.json. This exception does not audit the rest of the crate."

[[exemptions.blocking]]
version = "1.7.0"
criteria = "safe-to-deploy"
notes = "ADR 0111: принятый риск по решению владельца 2026-11-28, НЕ аудит. Прежняя запись ниже сохранена; её фраза о том, что wrapper отвергает exemptions, устарела. Проверено агентом, не человеком. No source audit granted. Root-only individually verified non-reachability exception. Only the unselected zbus async-io/async-process backend (and dependency dev metadata) requests blocking; root selects synchronous keyring Secret Service. Exact archive SHA-256 a70e4329df6cb94385eed412ec92375c3cdd8a6e502493d1229b6414e4036dfa. Read: workspace Cargo.toml, nw-cred/nw-vault manifests and relevant upstream dependency/feature sections; full empty inverse-tree outputs retained in review-2026-11-26-batch-5.json. Exact command: cargo tree --locked --offline --target all -e normal,build,dev -i blocking@1.7.0; repeated as cargo tree --locked --offline --target all -e normal,build,dev -i blocking@1.7.0 --all-features. Both exit 0 with empty stdout; no active normal/build/dev path for any target. Enabling keyring async-secret-service or zbus backends, adding a direct path, changing dependency features or replacing the lockfile invalidates this exception and requires renewed review. This does not certify dormant code or other graphs. ADR 0102 batch 5. Rechecked after ADR 0109 backend/lockfile changes: both locked offline target-all inverse trees (normal/build/dev, default and all workspace features) are still empty; see review-2026-11-26-dep-fixes.json."

