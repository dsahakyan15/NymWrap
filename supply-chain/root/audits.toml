Read both manifests, build.rs and all five source modules, including generic/SSE2/AVX/NEON paths and ARM DIT detection/guards. Unsafe word/vector loads receive checked exact-size slices after equal-length checks, use unaligned-capable operations and read only initialized byte/integer/vector types. Each loop consumes 16/32 bytes or one Word; tails use successively bounded integer widths, preserving a difference accumulator without data-dependent early exits. Register-only comparison/mask assembly declares inputs/outputs and does not touch memory or stack; SIMD modules are gated on corresponding target features. The atomic ARM feature cache is private and stores only valid Features discriminants; relaxed ordering suffices because it publishes no separate data. DIT/SB instructions follow standard feature detection or explicit unsafe caller overrides, and guards restore the saved DIT value on unwind. Build output is fixed cfg data selected from compiler version/target environment. Length and address timing remains observable; no universal hardware/compiler side-channel proof, instruction-count measurement, ARM execution or formal cryptographic audit is claimed. No native payload, dynamic allocation, file/network/process API or content logging. Tests cover functional equality and boundaries separately.
Exact reviewed file paths and SHA-256 are recorded in review-2026-11-26-batch-3.json. Source review is not an upstream test run; validation results and untested configurations are recorded separately there. Dependencies require separate coverage.
