[[audits.proc-macro2]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
delta = "1.0.106 -> 1.0.107"
notes = """
AI delta source review, not an independent human audit. Both published archives were read offline from the existing Cargo cache and SHA-256 verified against the cached registry index.
Base SHA-256: 8fd00f0bb2e90d81d1044c2b32617f68fcb9fa3bb7640c23e9c748e53fb30934.
Target SHA-256: 985e7ec9bb745e6ce6535b544d84d6cd6f7ad8bd711c398938ae983b91a766d9.
Reviewed the full package diff and surrounding float_digits and invalidate_current_thread_spans code. Replacing map_or(false, predicate) with is_some_and(predicate) preserves both None=false and Some predicate behavior. Removing the else after a diverging panic preserves the compiler-context rejection and calls the same fallback once otherwise. No new unsafe code, I/O, build script changes, dependency constraints or features. MSRV rises from 1.68 to 1.71, below NymWrap's pinned 1.100. Other changes are docs, a test lint, packaged development lockfile and upstream CI action versions; that upstream workflow is not run by NymWrap. Base and dependency coverage are separately required.
"""

[[audits.serde_spanned]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
delta = "1.1.1 -> 1.1.3"
notes = """
AI delta source review, not an independent human audit. Both published archives were read offline from the existing Cargo cache and SHA-256 verified against the cached registry index.
Base SHA-256: 6662b5879511e06e8999a8a235d848113e942c9124f211511b16466ee2995f26.
Target SHA-256: 9c187e0a369471c550af028cba56d4f4fa2a489ad28151ae95a4d340a2a8b782.
Reviewed all package differences and SpannedDeserializer field/key/value consumption. The only executable addition is a MapAccess::size_hint counting the three remaining Option fields. Each count is 0 or 1; their sum is bounded to 3 regardless of untrusted span values or T, and the method only borrows self. No new unsafe code, allocation, I/O or dependencies. Production features and build=false are unchanged. Remaining changes are packaging, lints, docs/license attribution, release/VCS metadata and the package's development lockfile. This delta does not certify dependencies or the base version.
"""

