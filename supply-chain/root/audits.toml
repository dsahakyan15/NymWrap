[[audits.async-recursion]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "1.2.0"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102); no independent human audit.
Published archive SHA-256: 4f8abc12baad266b1c8cec146854c195b5864b4221d4b2ca7296a7ae82d9e451. Matched Cargo.lock and the cached crates.io sparse index; reviewed bytes were read from the archive, with present unpacked Cargo sources compared byte-for-byte. No fresh crates.io API/uploader verification claimed.
Read both manifests and all three production modules (lib.rs, parse.rs, expand.rs). Arguments accept only optional ?Send and Sync, rejecting duplicates, excess and other syntax; the item must be an async function. Expansion removes async from the signature, adds explicit generic/reference outlives bounds and returns Pin<Box<dyn Future>> around Box::pin(async move { original body }). It adds Send/Sync bounds, never unsafe implementations or lifetime casts, so the Rust type checker enforces transfer/borrow validity. Newly synthesized lifetime names and the unqualified Box can collide with caller names; unsupported typed-self or nested-reference cases can reject otherwise valid source rather than bypass the type checker. The original function body and its authority remain caller code. Runtime recursion depth, allocation and exponential algorithms are not bounded by this transformation. No unsafe code, environment/file/network/process operations, build script or native payload. Reviewed generated deployed behavior, not just macro-host behavior.
Exact reviewed file paths and SHA-256 are recorded in review-2026-11-26-batch-3.json. Source review is not an upstream test run; validation results and untested configurations are recorded separately there. Dependencies require separate coverage.
"""

[[audits.bitflags]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
