user-id = 5059 # Artyom Pavlov (newpavlov)
start = "2025-11-12"
end = "2025-11-13"
notes = "ADR 0102. Trust the RustCrypto project lead for the named hash/KDF/cipher utility implementations and legacy getrandom release. This decision covers production untrusted-input handling, unsafe dispatch and OS entropy integration within those maintainership domains, with the documented RustCrypto constant-time constraints and rust-random platform-support/entropy policy; it is not inferred merely from successful execution. Algorithm misuse and dependent crates still need separate coverage. Exact publication verified with crates.io API, locked checksum, sparse index and archive SHA-256; evidence in review-2026-11-26.json. One-day historical window [start, end), no future releases."

