[[trusted.winnow]]
criteria = "safe-to-deploy"
user-id = 6743 # Ed Page (epage)
start = "2026-11-05"
end = "2026-11-06"
notes = "ADR 0102. Trust the Cargo/clap/TOML maintainer for production configuration parsing, serialization and parser-combinator handling of attacker-controlled text. The TOML project supplies the parser/serializer components used for Rust configuration; this covers parser safety and generated output, not only build/run behavior. Application schema/size/depth limits remain necessary. Exact publication verified with crates.io API, locked checksum, sparse index and archive SHA-256; evidence in review-2026-11-26.json. One-day historical window [start, end), no future releases."

[[trusted.zeroize]]
criteria = "safe-to-deploy"
trusted-publisher = "github:RustCrypto/utils"
start = "2026-11-17"
end = "2026-11-18"
notes = "ADR 0102. Trust the official RustCrypto utility maintainers and releases for zeroize and zeroize_derive, whose production contract covers compiler-resistant memory clearing and sound generated cleanup code. Trust applies to the implementation/derive invariants; preventing all copies, swap and memory disclosure remains a separate application/platform requirement. Exact publication verified with crates.io API, locked checksum, sparse index and archive SHA-256; evidence in review-2026-11-26.json. One-day historical window [start, end), no future releases."

