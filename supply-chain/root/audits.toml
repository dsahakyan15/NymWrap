[[audits.version_check]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "0.9.5"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102), not an independent human audit.
Published archive SHA-256: 0b928f33d975fc6ad9f86c8f283853ad26bdd5b10b7f1542aa2fa15e2289105a. Verified against crates.io API, locked checksum and sparse index; reviewed source files matched the archive.
Read both manifests, full archive inventory and all four source modules. No dependencies, build script, generated unsafe/native code, networking or file writes. The powerful import is Command::new(RUSTC or rustc) with fixed separate arguments --verbose --version: it does not invoke a shell or interpolate compiler output into a command. RUSTC/PATH and compiler execution are trusted build inputs, not remotely supplied request data. Other environment reads are Cargo/RUSTFLAGS feature probes. Version/date parsing uses checked u16 parsing and stops at a fourth component before assigning it; packed fields use fixed shifts/masks. UTF-8 validation and Option-based failure paths keep malformed compiler output from unsafe interpretation. Channel detection is intentionally permissive and dates are not full calendar validation; this is a compiler capability helper, not an authorization, signature or general version-policy parser. Source macros only generate ordinary cfg-probe example code; callers must choose suitable fallback cfgs. Ten upstream unit tests passed via direct pinned rustc; the packaged static historical-output corpus is absent and that test returns early as designed. No independent human audit.
Dependencies require separate coverage.
"""

[[audits.wasm-bindgen-shared]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "0.2.130"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102), not an independent human audit.
Published archive SHA-256: 3b1f9c3798725016c6ee5f2f57869ec0831e8bbc0ab0310a86e787e97f41389e. Verified against crates.io API, locked checksum and sparse index; reviewed source files matched the archive.
Read both manifests, complete archive inventory, build script and every library module, including shared schema macro definitions and all string/identifier helpers. No unsafe blocks, native payload or network access. The schema macro emits data declarations into a caller-supplied macro; it does not execute imported text or itself produce raw-pointer operations. Type-tag generation consumes a fixed list; module hashing uses explicit wrapping FNV arithmetic and checked byte indexing, not cryptographic authentication. Identifier helpers iterate Unicode scalar values, delegate XID membership to the separately covered unicode-ident dependency, replace invalid characters and prefix reserved JS keywords. Generated symbol and string helpers allocate proportional to caller text; escape_string handles backslash, both quotes and CR/LF for ordinary JS string literals. It is not an HTML/script-element sanitizer or a substitute for downstream code-generator validation. Build authority is limited to reading two fixed schema files beneath CARGO_MANIFEST_DIR, hashing their text, emitting Cargo metadata and invoking git rev-parse HEAD without a shell. Compiler/build environment and git/PATH are trusted build inputs; malformed git output can at most fail a build at its nine-byte prefix slice. The complete schema hash approval test passed after compiling/executing the reviewed build script with pinned rustc; its calculated schema hash matched upstream approval. No independent human audit; this does not certify downstream wasm-bindgen code generators, native/JS ABI implementation or arbitrary consuming macros.
Dependencies require separate coverage.
"""

