
# cargo-vet audits file

[[audits.bitflags]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "2.13.2"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102), not an independent human audit.
Published archive SHA-256: 3ded4057c258ba199e2d26386d3af3780957ecaee6c4ef4041c6b4b8b97c0b06. Verified against crates.io API, locked checksum and sparse index; reviewed source files matched the archive.
Read both manifests, archive inventory and all production macro/runtime modules, including optional serde/arbitrary/bytemuck integrations. Generated storage is a transparent single-field wrapper; the only unsafe output is Pod/Zeroable impls bounded on the corresponding property of that underlying field, with all bit patterns retained and no padding or drop state added. Primitive flag construction/set operations are fixed-width bitwise operations. Flag and attribute macro recursion consumes source syntax; cfg filtering is applied consistently to flag arrays and computed masks. Iterators advance a checked index over a finite static slice and emit residual bits once. Text parsing consumes pipe-delimited input using safe string/primitive conversion, rejects malformed names and numeric overflow; unknown bits are retained only in the documented non-strict paths. Runtime errors may retain input in std error strings, so callers must not log sensitive errors verbatim. Serde uses the same parser or the underlying bit representation, without opening streams. No build script, native code, file/network/process APIs or hidden authority. Resource use is proportional to caller input/flag tables; caller-provided traits, formatting sinks, expressions and attributes remain caller code. Root currently enables std; reviewed optional integrations do not certify their separate dependencies. Direct rustc review tests passed: all 256 u8 masks round-trip through formatting/parsing and iteration, cfg-disabled flags stay absent, and malformed/oversized/hostile text is rejected (2 tests). No independent human audit or upstream optional-feature test run.
Dependencies require separate coverage.
"""

[[audits.cfg-if]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
version = "1.0.5"
notes = """
AI full source review, not an independent human audit.
Published archive SHA-256: 4e7648175b45a9a48536d676f68d918270699102aa8dab5496df06904c914600.
Read offline from the existing Cargo cache and verified against the cached registry index. Reviewed the full lib.rs (including tests), both Cargo manifests, package file inventory and cross-crate test. The no_std macro selects the first matching cfg branch, excludes previously matched predicates, and wraps each branch in a helper invocation so cfg covers all its items. Recursion consumes one branch at each step; hygienic $crate paths avoid caller-name capture. No unsafe, build script, procedural macro, native code, I/O or ambient authority. The optional rustc-dep-of-std dependency remains subject to its separate audit.
Ordinary cargo test --offline did not resolve the uncached optional dependency and ran no tests. Direct default-feature tests with the pinned rustc/rustdoc passed: two unit tests, one cross-crate test and one doctest. This does not certify optional dependencies or platform CI.
"""

[[audits.endi]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102), not an independent human audit.
Published archive SHA-256: 66b7e2430c6dff6a955451e2cfc438f09cea1965a9d6f87f7e3b90decc014099. Verified against crates.io API, locked checksum and sparse index; reviewed source files matched the archive.
Read both manifests, complete archive inventory and all three source modules, including complete macro templates and the included README. No dependencies, unsafe code, build script, native code, environment access, file opening, network or process operations. Every integer/float read/write uses a fixed-width checked slice and the standard from/to_le/be_bytes operations, with fixed macro sizes from 1 through 16 bytes. The std extension traits only use caller-supplied Read/Write handles, fixed stack buffers and read_exact/write_all, propagating short reads and I/O errors. They do not select paths or endpoints. Direct Endian slice methods deliberately panic on buffers shorter than their documented primitive width; consumers of untrusted data must check that precondition or use the fallible ReadBytes interface. No unchecked length arithmetic or attacker-controlled allocation is introduced here; arbitrary trait implementations remain caller code. Eleven upstream endian unit tests passed with std; a separate no_std library compilation passed. The Read/Write extension implementation was reviewed but not exhaustively tested for third-party stream behavior. No independent human audit.
Dependencies require separate coverage.
"""

