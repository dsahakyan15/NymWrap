Read both manifests and the complete src/lib.rs, including rounding, sign handling, exponent movement and both unsafe operations. Also inspected the locked dtoa 1.0.11 Buffer/Float API in src/lib.rs (separately covered dependency): Float is sealed to f32/f64 and Buffer owns 25 bytes; format_finite returns bounded ASCII even for nonfinite inputs, whose numeric value is unspecified. The scratch array has size_of(Buffer)+1 bytes and is separate from the source, so copying the returned bytes starting at offset one fits without overlap. Precision is the internal constant 6 or 15, never caller-controlled. Rounding and forward exponent compaction stay within the initialized slice and preserve ASCII; the unchecked UTF-8 conversion therefore receives valid bytes. Zero/sign/large-exponent paths use checked slicing; custom fmt::Write remains caller code. Output is deliberately lossy and nonfinite values are not faithfully represented: unsuitable for exact numeric protocols, monetary calculations or authentication encodings. No allocation, build script, native payload or OS authority. Dependency internals are not recertified by the supporting API inspection.
