[[audits.async-recursion]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "1.2.0"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102); no independent human audit.
Published archive SHA-256: 4f8abc12baad266b1c8cec146854c195b5864b4221d4b2ca7296a7ae82d9e451. Matched Cargo.lock and the cached crates.io sparse index; reviewed bytes were read from the archive, with present unpacked Cargo sources compared byte-for-byte. No fresh crates.io API/uploader verification claimed.
Read both manifests and all three production modules (lib.rs, parse.rs, expand.rs). Arguments accept only optional ?Send and Sync, rejecting duplicates, excess and other syntax; the item must be an async function. Expansion removes async from the signature, adds explicit generic/reference outlives bounds and returns Pin<Box<dyn Future>> around Box::pin(async move { original body }). It adds Send/Sync bounds, never unsafe implementations or lifetime casts, so the Rust type checker enforces transfer/borrow validity. Newly synthesized lifetime names and the unqualified Box can collide with caller names; unsupported typed-self or nested-reference cases can reject otherwise valid source rather than bypass the type checker. The original function body and its authority remain caller code. Runtime recursion depth, allocation and exponential algorithms are not bounded by this transformation. No unsafe code, environment/file/network/process operations, build script or native payload. Reviewed generated deployed behavior, not just macro-host behavior.
Exact reviewed file paths and SHA-256 are recorded in review-2026-11-26-batch-3.json. Source review is not an upstream test run; validation results and untested configurations are recorded separately there. Dependencies require separate coverage.
"""

[[audits.bitflags]]
who = "NymWrap source review (Codex agent; not human)"
criteria = "safe-to-deploy"
version = "2.13.2"
notes = """
Проверено агентом, не человеком. Agent source review for product safe-to-deploy (ADR 0102), not an independent human audit.
Published archive SHA-256: 3ded4057c258ba199e2d26386d3af3780957ecaee6c4ef4041c6b4b8b97c0b06. Verified against crates.io API, locked checksum and sparse index; reviewed source files matched the archive.
Read both manifests, archive inventory and all production macro/runtime modules, including optional serde/arbitrary/bytemuck integrations. Generated storage is a transparent single-field wrapper; the only unsafe output is Pod/Zeroable impls bounded on the corresponding property of that underlying field, with all bit patterns retained and no padding or drop state added. Primitive flag construction/set operations are fixed-width bitwise operations. Flag and attribute macro recursion consumes source syntax; cfg filtering is applied consistently to flag arrays and computed masks. Iterators advance a checked index over a finite static slice and emit residual bits once. Text parsing consumes pipe-delimited input using safe string/primitive conversion, rejects malformed names and numeric overflow; unknown bits are retained only in the documented non-strict paths. Runtime errors may retain input in std error strings, so callers must not log sensitive errors verbatim. Serde uses the same parser or the underlying bit representation, without opening streams. No build script, native code, file/network/process APIs or hidden authority. Resource use is proportional to caller input/flag tables; caller-provided traits, formatting sinks, expressions and attributes remain caller code. Root currently enables std; reviewed optional integrations do not certify their separate dependencies. Direct rustc review tests passed: all 256 u8 masks round-trip through formatting/parsing and iteration, cfg-disabled flags stay absent, and malformed/oversized/hostile text is rejected (2 tests). No independent human audit or upstream optional-feature test run.
Dependencies require separate coverage.
"""

