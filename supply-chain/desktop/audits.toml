Read both manifests and complete src/lib.rs (the only Rust source). Also inspected the locked dtoa 1.0.11 Buffer definition, format_finite contract and sealed Float interface to check the local unsafe preconditions; this is not a separate audit of dtoa. dtoa returns ASCII backed by its 25-byte Buffer; scratch is size_of<Buffer>+1, so copying the returned bytes at offset one stays within a distinct initialized allocation. Float is sealed to f32/f64 and precision is private/fixed at 6/15, preventing hostile implementations or size arithmetic. restrict_prec uses checked indexing, a leading carry slot, finite bounded loops, ASCII digit edits and forward copies when the exponent moves left; these preserve UTF-8 for the release unchecked conversion. Writer errors propagate and the caller owns the fmt::Write destination; no file/socket is opened. No build script, OS authority or FFI. Nonfinite values have dtoa format_finite's unspecified numeric representation and negative zero may normalize to zero; not a roundtrip/financial serializer. Dependencies remain separately vetted.
Additional carry/rounding/writer-error and 100,000 generated f32/f64 bit-pattern checks passed with debug assertions enabled and with this library separately recompiled in optimized release mode; not Miri, sanitizers or an exhaustive floating-point proof. Dependencies and downstream use require their own audit paths. This is a new safe-to-deploy review, not an upgrade of a fuzz safe-to-run audit. ADR 0104 third desktop pass; evidence in review-2026-11-26-desktop-3.json.
