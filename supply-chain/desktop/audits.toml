"""

[[audits.version_check]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "0.9.5"
notes = """
Проверено агентом, не человеком. AI full source review by Codex; not an independent human audit.
Published archive SHA-256: 0b928f33d975fc6ad9f86c8f283853ad26bdd5b10b7f1542aa2fa15e2289105a.
Read the complete package inventory, both manifests and all four source modules including tests. No dependencies, unsafe code, native code or own build script. The sole production ambient authority is launching the caller-selected RUSTC (or rustc on PATH) with fixed --verbose --version arguments using Command without a shell, and reading compiler feature environment flags. This is appropriate for a build-time compiler probe, under the same trusted-toolchain assumption as Cargo; child output is not bounded and no timeout is imposed, so this is not an API for executing attacker-selected compilers. Version and date parsing use checked u16 parsing, fixed arrays and early return before a fourth element can be stored; packed shifts have fixed valid widths. String iteration is finite and UTF-8 safe. Dates reject out-of-range month/day but are not calendar validation (e.g. February 31); channel recognition intentionally accepts suffix matches. Those are compiler metadata helpers, not authorization/date validation. Feature flags only affect the caller build configuration, never execute model/import text or select a network destination. Tests read optional excluded static fixtures only when present. No serious production exploit identified in reasonable build-time use. This is a new safe-to-deploy review, not an upgrade of the fuzz safe-to-run audit.
Direct rustc unit tests and rustdoc examples passed. Package dependencies and downstream uses remain separately subject to vet. ADR 0104."""

