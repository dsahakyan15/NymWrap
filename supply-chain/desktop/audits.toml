Target SHA-256: 9c187e0a369471c550af028cba56d4f4fa2a489ad28151ae95a4d340a2a8b782.
Reviewed all package differences and SpannedDeserializer field/key/value consumption. The only executable addition is a MapAccess::size_hint counting the three remaining Option fields. Each count is 0 or 1; their sum is bounded to 3 regardless of untrusted span values or T, and the method only borrows self. No new unsafe code, allocation, I/O or dependencies. Production features and build=false are unchanged. Remaining changes are packaging, lints, docs/license attribution, release/VCS metadata and the package's development lockfile. This delta does not certify dependencies or the base version.
"""

[[audits.stable_deref_trait]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "1.2.1"
notes = """
Проверено агентом, не человеком. AI full source review by Codex; not an independent human audit.
Published archive SHA-256: 6ce2be8dc25455e1f91df71bfa12ad37d7af1092ae736f3a6cd0e37bc7810596.
Read the entire single-module crate including unsafe marker contracts, every unsafe impl, documentation examples, both manifests and archive inventory. No dependencies, build script, raw pointer operations, native code or ambient I/O. Reasoned about each unsafe impl: Box/Vec/String and owned path/C/OS strings dereference to separately allocated storage stable across moves; their shared methods cannot reallocate the target. The concrete Cow str/slice/path/CStr/OsStr forms preserve target address through shared access; ownership conversion requires mutable access outside the StableDeref promise. Rc/Arc keep target allocation fixed and are the owned types allowed CloneStableDeref; mutable access uses normal unique-borrow rules, not a blanket CloneStableDeref on mutable references. Ref/RefMut and lock guards hold the borrow/lock while dereferencing to the same target. Shared and mutable references preserve pointee location; CloneStableDeref is implemented only for shared references. Arc impls are gated on pointer atomics. The unsafe traits explicitly bind downstream implementers; this review does not certify external unsafe implementations or consumers that violate aliasing/lifetimes or retain references after a guard drops. All std, alloc and no-default configurations were considered.
Direct rustc unit tests and rustdoc examples passed. No-default, alloc and std configurations also compiled. Package dependencies and downstream uses remain separately subject to vet. ADR 0104."""

