[[audits.proc-macro2]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
delta = "1.0.106 -> 1.0.107"
notes = """
AI delta source review, not an independent human audit. Both published archives were read offline from the existing Cargo cache and SHA-256 verified against the cached registry index.
Base SHA-256: 8fd00f0bb2e90d81d1044c2b32617f68fcb9fa3bb7640c23e9c748e53fb30934.
Target SHA-256: 985e7ec9bb745e6ce6535b544d84d6cd6f7ad8bd711c398938ae983b91a766d9.
Reviewed the full package diff and surrounding float_digits and invalidate_current_thread_spans code. Replacing map_or(false, predicate) with is_some_and(predicate) preserves both None=false and Some predicate behavior. Removing the else after a diverging panic preserves the compiler-context rejection and calls the same fallback once otherwise. No new unsafe code, I/O, build script changes, dependency constraints or features. MSRV rises from 1.68 to 1.71, below NymWrap's pinned 1.100. Other changes are docs, a test lint, packaged development lockfile and upstream CI action versions; that upstream workflow is not run by NymWrap. Base and dependency coverage are separately required.
"""

[[audits.serde_spanned]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
delta = "1.1.1 -> 1.1.3"
notes = """
AI delta source review, not an independent human audit. Both published archives were read offline from the existing Cargo cache and SHA-256 verified against the cached registry index.
Base SHA-256: 6662b5879511e06e8999a8a235d848113e942c9124f211511b16466ee2995f26.
Target SHA-256: 9c187e0a369471c550af028cba56d4f4fa2a489ad28151ae95a4d340a2a8b782.
Reviewed all package differences and SpannedDeserializer field/key/value consumption. The only executable addition is a MapAccess::size_hint counting the three remaining Option fields. Each count is 0 or 1; their sum is bounded to 3 regardless of untrusted span values or T, and the method only borrows self. No new unsafe code, allocation, I/O or dependencies. Production features and build=false are unchanged. Remaining changes are packaging, lints, docs/license attribution, release/VCS metadata and the package's development lockfile. This delta does not certify dependencies or the base version.
"""

[[audits.stable_deref_trait]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "1.2.1"
notes = """
Проверено агентом, не человеком. AI full source review by Codex; not an independent human audit.
Published archive SHA-256: 6ce2be8dc25455e1f91df71bfa12ad37d7af1092ae736f3a6cd0e37bc7810596.
Read the entire single-module crate including unsafe marker contracts, every unsafe impl, documentation examples, both manifests and archive inventory. No dependencies, build script, raw pointer operations, native code or ambient I/O. Reasoned about each unsafe impl: Box/Vec/String and owned path/C/OS strings dereference to separately allocated storage stable across moves; their shared methods cannot reallocate the target. The concrete Cow str/slice/path/CStr/OsStr forms preserve target address through shared access; ownership conversion requires mutable access outside the StableDeref promise. Rc/Arc keep target allocation fixed and are the owned types allowed CloneStableDeref; mutable access uses normal unique-borrow rules, not a blanket CloneStableDeref on mutable references. Ref/RefMut and lock guards hold the borrow/lock while dereferencing to the same target. Shared and mutable references preserve pointee location; CloneStableDeref is implemented only for shared references. Arc impls are gated on pointer atomics. The unsafe traits explicitly bind downstream implementers; this review does not certify external unsafe implementations or consumers that violate aliasing/lifetimes or retain references after a guard drops. All std, alloc and no-default configurations were considered.
Direct rustc unit tests and rustdoc examples passed. No-default, alloc and std configurations also compiled. Package dependencies and downstream uses remain separately subject to vet. ADR 0104."""

[[audits.toml_datetime]]
who = "NymWrap automated source review (Codex)"
criteria = "safe-to-deploy"
delta = "1.1.1+spec-1.1.0 -> 1.1.3+spec-1.1.0"
notes = """
AI delta source review, not an independent human audit. Both published archives were read offline from the existing Cargo cache and SHA-256 verified against the cached registry index.
Base SHA-256: 3165f65f62e28e0115a00b2ebdd37eb6f3b641855f9d636d3cd4103767159ad7.
Target SHA-256: 173f25c883cd2176a2d8212155638c0a60d484a9d84546d270866f40f56b6e49.
Reviewed all package differences and the surrounding DatetimeDeserializer implementation. The only executable change adds MapAccess::size_hint as Some(usize::from(date.is_some())). The Option is consumed by next_value_seed, so the hint is bounded to 0 or 1 and has no new allocation, I/O, unsafe code or state mutation. Production dependency constraints, features and build=false are unchanged. Other differences are packaging include paths, lints, release/docs/license attribution, VCS metadata and the package's own development lockfile. Dependencies and the previously audited base require their own audit paths.
"""

[[audits.version_check]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "0.9.5"
notes = """
Проверено агентом, не человеком. AI full source review by Codex; not an independent human audit.
Published archive SHA-256: 0b928f33d975fc6ad9f86c8f283853ad26bdd5b10b7f1542aa2fa15e2289105a.
Read the complete package inventory, both manifests and all four source modules including tests. No dependencies, unsafe code, native code or own build script. The sole production ambient authority is launching the caller-selected RUSTC (or rustc on PATH) with fixed --verbose --version arguments using Command without a shell, and reading compiler feature environment flags. This is appropriate for a build-time compiler probe, under the same trusted-toolchain assumption as Cargo; child output is not bounded and no timeout is imposed, so this is not an API for executing attacker-selected compilers. Version and date parsing use checked u16 parsing, fixed arrays and early return before a fourth element can be stored; packed shifts have fixed valid widths. String iteration is finite and UTF-8 safe. Dates reject out-of-range month/day but are not calendar validation (e.g. February 31); channel recognition intentionally accepts suffix matches. Those are compiler metadata helpers, not authorization/date validation. Feature flags only affect the caller build configuration, never execute model/import text or select a network destination. Tests read optional excluded static fixtures only when present. No serious production exploit identified in reasonable build-time use. This is a new safe-to-deploy review, not an upgrade of the fuzz safe-to-run audit.
Direct rustc unit tests and rustdoc examples passed. Package dependencies and downstream uses remain separately subject to vet. ADR 0104."""

