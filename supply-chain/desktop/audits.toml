[[audits.android_system_properties]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "0.1.6"
notes = """
Проверено агентом, не человеком. AI full published production source review by Codex; not an independent human audit.
Published archive SHA-256: ae221649c9976a6f6c56ae1facf410f3ddb33cc661c4b7b61020a912d4237fbc.
Read files: Cargo.toml, Cargo.toml.orig, examples/time_zone.rs, src/lib.rs. Complete archive inventory and byte equality of read files against the SHA-verified archive were checked.
Read both manifests, the complete single library source and time_zone example. Reviewed every unsafe block, Send/Sync impl, function-pointer ABI, callback and Drop. Only fixed libc.so and fixed system-property symbol names are dynamically loaded on Android; the handle outlives all calls and is closed once on exclusive Drop. Bionic property access is thread-safe, function fields are immutable and callback output is a stack-owned Option<String> valid for the synchronous read_callback call; invalid UTF-8 produces None. The old getter reserves PROP_VALUE_MAX=92 bytes, relies on the documented Android API bound including its terminator, checks the returned length before set_len and converts initialized bytes with checked UTF-8. CString rejects interior NUL; no name is executed or used as a pathname. Non-Android construction has no functions/handle and returns None. Allocation OOM aborts rather than unwinding a Rust panic through C; arbitrary replacement libc implementations are outside the OS trust model. This is intentional access to possibly identifying OS property data, not authorization to collect or transmit it; NymWrap lane/sandbox/egress policy remains separate. No build script, native archive, network or subprocess. Android runtime and cross-platform builds were not tested on this Windows reviewer host; source review relies on the Bionic ABI contract and independently vetted libc.
Runtime tests not run in this source review; no cross-platform or full feature matrix claim. Dependencies and downstream use require their own audit paths. This is a new safe-to-deploy review, not an upgrade of a fuzz safe-to-run audit. ADR 0104 third desktop pass; evidence in review-2026-11-26-desktop-3.json.
"""

[[audits.cesu8]]
who = "NymWrap automated source review (Codex agent, not human)"
criteria = "safe-to-deploy"
version = "1.1.0"
notes = """
Проверено агентом, не человеком. AI full published production source review by Codex; not an independent human audit.
Published archive SHA-256: 6d43a04d8753f35258c91f8ec639f792891f748a1edbd759cf1dcea3382ad83c.
Read files: Cargo.toml, src/lib.rs, src/unicode.rs. Complete archive inventory and byte equality of read files against the SHA-verified archive were checked.
Read the sole published manifest (no Cargo.toml.orig in this historical archive) and both complete source modules, including the embedded tests and width table. No dependencies, build script, native code, I/O or OS authority. For decoding, the fast path uses standard UTF-8 validation; the fallback accepts only ASCII, valid non-overlong 2/3-byte sequences and a validated high/low surrogate pair, whose arithmetic stays in U+10000..U+10FFFF before UTF-8 construction. These cases justify String::from_utf8_unchecked. Encoding starts from valid Rust str, advances only by its scalar width and checks bounds before the unchecked 4-byte subslice conversion. The allocation capacity expression underestimates typical output and may over-allocate/grow; Vec remains bounds checked and overflow/OOM/resource limits are caller concerns. Important semantic limit: valid UTF-8 is returned by the decoder fast path even when it includes literal NUL in Java mode or native 4-byte sequences. Therefore these decoders are converters, not strict canonical CESU-8/modified-UTF-8 validators or security filters. No serious production exploit identified under that documented review boundary.
Two upstream unit tests and two extra probes passed: every valid Unicode scalar roundtrips through both encoders/decoders; all 65,536 two-byte inputs were checked for valid UTF-8 on successful decoding, along with malformed surrogates and documented permissive fast-path cases. Not a complete fuzz/Miri or cross-platform proof. Dependencies and downstream use require their own audit paths. This is a new safe-to-deploy review, not an upgrade of a fuzz safe-to-run audit. ADR 0104 third desktop pass; evidence in review-2026-11-26-desktop-3.json.
"""

