[policy.dbus-secret-service]
audit-as-crates-io = true
notes = "ADR 0109: the local OpenSSL patch fixes specific defects but does not certify the third-party base or protocol. Keep the registry base in cargo-vet review; local modifications require separate review. No audit is granted by converting a crate to a path dependency."

[[exemptions.dirs-sys]]
version = "0.5.0"
criteria = "safe-to-deploy"
notes = "Проверено агентом, не человеком. This is a deployment-specific exemption, NOT a safe-to-deploy source audit. Archive SHA-256 e01a3366d27ee9890022452ee61b2b63a67e6f13f58900b651ff5665f0bb1fab. Malformed XDG_DIR key and one-quote XDG value reproduce slice panics in the exact published parser (ASCII OS-string shim on Windows; no native Unix runtime claimed). Current NymWrap does not call dirs/dirs-sys or Tauri PathResolver natively; main capability has permissions=[], including no core:path:allow-resolve-directory. Tauri from_config sets download_handler=None, NymWrap never installs on_download, tauri-runtime-wry forwards download hooks only for Some(handler), and Wry installs the Linux download-dir callback only when a hook is present. Remaining initialization/build calls use base/home directories and do not parse user-dirs.dirs. Re-evaluate before changing any native path call, Tauri capability, window/download handler, config resource path or these dependency versions. No fixed published dirs-sys version was available in the checked registry response (latest 0.5.0). Exact code paths, source hashes, synthetic reproductions and limits: docs/adr/0104-desktop-dependency-audit-sources.md#dirs-sys-050-достижимость-и-исключение and review-2026-11-26-desktop-4.json. The repository wrapper continues to reject exemptions; its gate is not weakened or declared green."

[[exemptions.ordered-stream]]
version = "0.2.0"
criteria = "safe-to-deploy"
notes = "Проверено агентом, не человеком. Deployment-specific non-reachability exemption, NOT a safe-to-deploy source audit. Exact archive SHA-256 9aa2b01e1d916879f73a53d01d1d6cee68adbb31d6d9177a8cfce093cced1d50. In app/src-tauri, cargo tree --locked --offline --target all -e normal,build,dev -i ordered-stream and cargo tree --locked --offline --target all -e normal,build,dev --all-features -i ordered-stream both exit 0 with empty stdout and 'nothing to print'. Cargo metadata/lock retains the optional asynchronous secret-service/zbus graph, but nw-cred and nw-vault select keyring sync-secret-service, crypto-openssl and vendored on Linux (ADR 0109); the async-secret-service backend is not enabled. No current desktop target/feature selection reaches this crate. Enabling keyring async-secret-service, adding a direct dependency, changing any transitive feature forwarding/manifest or dependency version invalidates this exemption; repeat both exact commands and complete source review before deployment. The earlier position_hint concern is not independently reproduced or declared fixed by this pass. Analysis, hashes and complete command output: docs/adr/0104-desktop-dependency-audit-sources.md#desktop-5-unreachable and review-2026-11-26-desktop-5.json. The unchanged repository wrapper still rejects exemptions."

[[exemptions.recvmsg]]
version = "1.0.0"
criteria = "safe-to-deploy"
notes = "Проверено агентом, не человеком. Deployment-specific exception for recvmsg 1.0.0, NOT a safe-to-deploy source audit. Archive SHA-256 d3edd4d5d42c92f0a659926464d4cce56b562761267ecf0f469d85b7de384175. The desktop-5 synthetic ledger-owner probe was rerun: MsgBuf::try_extend_lifetime drops the original owned buffer before returning its copied owner (one premature and two total nonempty releases); make_owned delegates to it. This known UAF/double-free risk is not accepted for executable paths. Current root and desktop reach the crate only through interprocess 2.4.9 -> nw-ipc. NymWrap imports only local_socket::tokio::Stream/Listener and security/credential helpers. nw-ipc read_frame_timeout allocates Zeroizing<Vec<u8>> and passes a borrowed slice to AsyncReadExt::read_exact. Local socket dispatch on Windows uses DuplexPipeStream<Bytes>, whose AsyncRead forwards to RawPipeStream::poll_read_readbuf -> Tokio try_read_buf(ReadBuf); on Unix it uses Tokio UnixStream::try_read_buf. No MsgBuf, OwnedBuf, RecvMsg/AsyncRecvMsg, make_owned or try_extend_lifetime occurs on these paths. Windows message-mode RecvMsg is a separate impl for PipeStream<Messages, Sm>; the dependency is still compiled, not wholly unreachable. Invalidate before any new interprocess/recvmsg caller or dependency edge, message/datagram API or buffer-owner conversion, changes to nw-ipc framing/local stream exports, relevant features/platforms, or either dependency version. Repeat source-path review and the ledger probe before renewing. Exact path/source hashes and limitations: docs/adr/0110-cargo-vet-findings-and-ipc-reachability.md and supply-chain/root/review-2026-11-26-dep-fixes.json. Wrapper still rejects all exemptions; release gate remains failed."

[[exemptions.winapi-i686-pc-windows-gnu]]
version = "0.4.0"
criteria = "safe-to-deploy"
notes = "Проверено агентом, не человеком. Deployment-specific target exemption, NOT a source or native-binary safe-to-deploy audit. Exact archive SHA-256 ac3b87c63620426dd9b991e5ce0329eff545bccbbb34f3be09ff6fb6ab51b7b6. cargo tree --locked --offline --target all -e normal,build,dev -i winapi-i686-pc-windows-gnu, with and without --all-features, DOES include this package through winapi 0.3.9; --target all is not evidence of compilation for MSVC. In app/src-tauri, cargo tree --locked --offline --target x86_64-pc-windows-msvc -e normal,build,dev -i winapi-i686-pc-windows-gnu and the same command with --all-features both exit 0, empty stdout, 'nothing to print'. The identical two checks for x86_64-unknown-linux-gnu and aarch64-apple-darwin are also empty. rustc -vV host is x86_64-pc-windows-msvc; rustup target list --installed contains no Windows GNU target. CI/release/reproducible workflows and .cargo/config.toml inspected: Windows uses the MSVC host, release is Linux, no Windows GNU build/packaging/custom target exists. Published winapi 0.3.9 Cargo.toml declares this dependency only under target.i686-pc-windows-gnu.dependencies; the package build.rs emits its lib search path only for TARGET=i686-pc-windows-gnu. Bundled import archives were hash-inventoried but not disassembled or supplier-certified. Before any Windows GNU/cross/custom target, host-toolchain/CI/release target change, direct dependency bypassing cfg, or dependency-version change, invalidate this exemption and audit the native distribution; repeat exact target trees. Full evidence: docs/adr/0104-desktop-dependency-audit-sources.md#desktop-5-unreachable and review-2026-11-26-desktop-5.json. The repository wrapper remains unchanged and rejects exemptions."

