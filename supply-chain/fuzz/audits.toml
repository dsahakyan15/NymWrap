[[audits.blocking]]
who = "NymWrap automated source review (Codex agent)"
criteria = "safe-to-run"
version = "1.7.0"
notes = """
Agent source review for the unshipped fuzz workspace (ADR 0088), not an independent human audit or safe-to-deploy certification.
Published archive read offline from the Cargo cache; SHA-256 verified against crates.io API and sparse registry index: a70e4329df6cb94385eed412ec92375c3cdd8a6e502493d1229b6414e4036dfa. Rust/manifests reviewed from the unpacked cache were byte-compared with that archive.
Read both manifests and the complete library state machine, pool scheduling, thread creation, Unblock read/write/seek/stream adapters and cancellation transitions. Expected authority is running caller-submitted closures and caller-supplied I/O on lazily spawned blocking-N threads; there is no task until requested. The BLOCKING_MAX_THREADS environment setting is parsed and clamped to 1..10000, default 500; the explicit setter accepts a caller-chosen nonzero limit. Idle workers use a condvar timeout. Adapter buffers default to 8 MiB for I/O or 8192 stream items, with caller override; queues and submitted work are not globally bounded. No own file/socket opens, subprocesses, downloads or build script. Unsafe code is forbidden. Caller closures can block forever or exhaust resources, and cancellation cannot forcibly stop arbitrary blocking I/O; this safe-to-run decision assumes controlled local harness work, not an untrusted task sandbox.
Dependencies require separate coverage. No crate-specific tests were run as part of this source review.
"""

