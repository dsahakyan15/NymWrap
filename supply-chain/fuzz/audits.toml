[[audits.bitflags]]
who = "NymWrap automated source review (Codex agent)"
criteria = "safe-to-run"
version = "2.13.2"
notes = """
Agent source review for the unshipped fuzz workspace (ADR 0088), not an independent human audit or safe-to-deploy certification.
Published archive read offline from the Cargo cache; SHA-256 verified against the cached registry index: 3ded4057c258ba199e2d26386d3af3780957ecaee6c4ef4041c6b4b8b97c0b06.
Read package inventory, both manifests and every production module, including complete macro templates, parser, iterators, traits and optional serde/arbitrary/bytemuck integrations. No build script or native code. Generated code implements primitive bit operations, transparent storage, finite flag lookup/iteration and formatting to caller-provided fmt::Write/serde destinations. Parser consumes input split by | and returns errors for empty/unknown/invalid hex flags. Macro recursion consumes supplied syntax; user expressions/attributes remain the caller's Rust code. Optional bytemuck unsafe marker impls require the underlying primitive Pod/Zeroable type and transparent internal wrapper; no executable unsafe blocks were found. No file/environment/socket/process APIs, constructors or background tasks. Resource use scales with caller input/iterators; this is not an audit of arbitrary caller traits or production parser correctness.
Dependencies require separate coverage. No crate-specific tests were run as part of this source review.
"""

