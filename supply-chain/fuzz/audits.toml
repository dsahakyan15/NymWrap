Read package inventory, both manifests, both production library modules and the gen_hash_test binary. Generation uses a fixed-seed in-memory fastrand generator, caller-provided hash callbacks, bucket/displacement search and caller-sized vectors. Optional ptrhash retries random seeds with bounded pilot searches and in-memory relocation; it does not obtain OS entropy. No unsafe code, build script, filesystem, environment, network, subprocesses or installation. Generation assumes a finite set of distinct build-time keys: duplicate/adversarial keys or callbacks can cause unbounded retry/CPU use, and oversized tables can panic or exhaust memory. Safe-to-run here covers controlled local build inputs, not hostile runtime key sets. The explicit benchmark binary generates one million strings only when the user runs it; it is not started during dependency builds. No cryptographic or production denial-of-service guarantee is claimed.
Dependencies require separate coverage. No crate-specific tests were run as part of this source review.
"""

