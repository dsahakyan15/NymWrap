[[audits.errno]]
who = "NymWrap automated source review (Codex agent)"
criteria = "safe-to-run"
version = "0.3.15"
notes = """
Agent source review for the unshipped fuzz workspace (ADR 0088), not an independent human audit or safe-to-deploy certification.
Published archive read offline from the Cargo cache; SHA-256 verified against the cached registry index: e35d6e78f4cebb90e51d543db8fe41528851d6deeef6ef21ebd4bfdc1e784776.
Read package inventory, both manifests and all six source modules, including Unix, Windows, WASI, Hermit and unsupported-target branches. Expected authority is reading/writing the current thread's OS error slot and obtaining a system error description. Unix/WASI use strerror_r into a fixed 1024-byte stack buffer, errno-location FFI and UTF-8 valid-prefix conversion, relying on the OS/libc string contract. Windows uses GetLastError/SetLastError and FormatMessageW with FROM_SYSTEM|IGNORE_INSERTS into fixed stack buffers; decoded UTF-16 is copied into a bounded UTF-8 buffer. Hermit stubs return fixed values; unsupported targets fail compilation. Unsafe operations are limited to these OS buffer/pointer/string interfaces; no build script, file/socket access, process execution, installation or background work. This source review does not independently verify every platform's libc/Win32 ABI or replace native-platform tests.
Dependencies require separate coverage. No crate-specific tests were run as part of this source review.
"""

