[target.'cfg(windows)'.dependencies]
quick-xml.workspace = true
windows-sys = { version = "=0.61.2", features = [
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_System_Time",
    "Win32_Foundation", "Win32_Security", "Win32_Security_Isolation",
    "Win32_Security_Authorization", "Win32_System_Threading",
    "Win32_System_WindowsProgramming", "Win32_System_JobObjects",
    "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi",
    "Win32_System_Com", "Win32_System_Memory", "Win32_System_SystemInformation",
    "Win32_System_ErrorReporting", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem"
] }

