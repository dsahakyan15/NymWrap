[package]
name = "nw-netd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[features]
experimental-zkapi = ["nw-net/experimental-zkapi"]
experimental-nym = ["nw-net/experimental-nym"]

[dependencies]
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio","rustls","compression","static-sqlite","pt-client"] }
tor-ptmgr = "=0.48.0"
sha2 = "=0.10.9"
tor-rtcompat = { version = "=0.48.0", features = ["tokio","rustls"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread","macros","sync","time","io-util","signal"] }
tokio-util = { version = "=0.7.20", features = ["compat"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring","tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring","std","tls12"] }
webpki-roots = "=1.0.12"
hyper = {version="=1.12.0",features=["client","http1"]}
hyper-util = {version="=0.1.21",features=["tokio"]}
http-body-util = "=0.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = {version="=1.9.2",features=["derive"]}
secrecy = "=0.10.3"
nw-net = {path="../../crates/nw-net",version="=0.1.0"}
nw-ipc = {path="../../crates/nw-ipc",version="=0.1.0"}
nw-platform = {path="../../crates/nw-platform",version="=0.1.0"}
nw-proto = {path="../../crates/nw-proto",version="=0.1.0"}

[dev-dependencies]
nw-shield = {path="../../crates/nw-shield",version="=0.1.0"}
tempfile = "=3.27.0"
tor-llcrypto = "=0.48.0"
tor-proto = {version="=0.48.0",features=["stream-ctrl"]}
hex-literal = "=1.1.0"
base64ct = {version="=1.8.3",features=["alloc"]}

[lints.rust]
unsafe_code="forbid"

[patch.crates-io]
rustls={path="../../vendor/rustls"}
tor-ptmgr={path="../../vendor/tor-ptmgr"}
tor-llcrypto={path="../../vendor/tor-llcrypto"}
tor-key-forge={path="../../vendor/tor-key-forge"}
rusqlite={path="../../vendor/rusqlite-compat"}

[profile.release]
lto="thin"
codegen-units=1
strip=true
panic="abort"
