name: macos-sandbox
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
jobs:
  seatbelt:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test -p nw-platform --test macos_probe --locked
      - run: cargo test -p nw-sandbox --test macos --locked -- --nocapture
      - run: cargo clippy -p nw-sandbox -p nw-platform --all-targets --locked -- -D warnings
