name: reproducible-release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
jobs:
  build:
    name: clean-linux-${{ matrix.copy }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - copy: a
            runner: ubuntu-24.04
          - copy: b
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - run: node scripts/repro-build.mjs target/unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-linux-${{ matrix.copy }}
          path: target/unsigned/*
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: independent-linux-*
          path: target/independent
      - name: Compare actual SHA-256, complete file sets and source revision
        run: node scripts/release-artifacts.mjs compare target/independent/independent-linux-a target/independent/independent-linux-b target/release "$(git rev-parse HEAD)"
      - shell: pwsh
        run: ./scripts/validate-sbom.ps1 -Path target/release/nymwrap-linux-x86_64.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nymwrap-unsigned-linux-x86_64
          path: target/release/*
          if-no-files-found: error
