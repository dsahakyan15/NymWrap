name: fuzz smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [audit_import, ipc_frames, shield_roundtrip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev libdbus-1-dev
      - run: rustup toolchain install nightly-2026-11-20 --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - run: node scripts/fuzz.mjs --target ${{ matrix.target }} --seconds 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            target/fuzz/reports
            fuzz/artifacts
          if-no-files-found: ignore
