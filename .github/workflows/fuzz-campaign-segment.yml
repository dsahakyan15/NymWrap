name: Fuzz campaign segment (reusable)
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      index:
        required: true
        type: string
      previous:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate segment identifiers before downloading files
        env:
          NYMWRAP_FUZZ_TARGET: ${{ inputs.target }}
          NYMWRAP_FUZZ_INDEX: ${{ inputs.index }}
          NYMWRAP_FUZZ_PREVIOUS: ${{ inputs.previous }}
        run: node scripts/fuzz-campaign.mjs validate "$NYMWRAP_FUZZ_TARGET" "$NYMWRAP_FUZZ_INDEX" "$NYMWRAP_FUZZ_PREVIOUS"
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz24-build-a${{ github.run_attempt }}-${{ inputs.target }}
          path: target/fuzz/campaign/${{ inputs.target }}/bundle
      - if: inputs.previous != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz24-state-a${{ github.run_attempt }}-${{ inputs.target }}-${{ inputs.previous }}
          path: target/fuzz/campaign/${{ inputs.target }}/state
      - name: Run one complete four-hour execution
        env:
          NYMWRAP_FUZZ_TARGET: ${{ inputs.target }}
          NYMWRAP_FUZZ_INDEX: ${{ inputs.index }}
        run: |
          ulimit -c 0
          node scripts/fuzz-campaign.mjs run "$NYMWRAP_FUZZ_TARGET" "$NYMWRAP_FUZZ_INDEX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz24-receipt-a${{ github.run_attempt }}-${{ inputs.target }}-${{ inputs.index }}
          path: target/fuzz/campaign/receipts/${{ inputs.target }}-${{ inputs.index }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: fuzz24-state-a${{ github.run_attempt }}-${{ inputs.target }}-${{ inputs.index }}
          path: target/fuzz/campaign/${{ inputs.target }}/state
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz24-diagnostics-a${{ github.run_attempt }}-${{ inputs.target }}-${{ inputs.index }}
          path: |
            target/fuzz/campaign/${{ inputs.target }}/crashes
            target/fuzz/campaign/${{ inputs.target }}/fuzzer-tail.log
          if-no-files-found: ignore
          retention-days: 7
